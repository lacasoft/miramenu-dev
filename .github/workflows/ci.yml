# CI for Miramenu: runs on every pull request to master and on every push to master.
# Derived from the repo: npm workspaces with package-lock.json, Node from .nvmrc (26 LTS),
# and the real package.json commands: lint (workspace lints, package typechecks and
# architecture rules), test (unit + e2e), build of every workspace and the tokens CSS check.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, typecheck and architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # No dependency needs an install script for lint, test or build
      # (only @parcel/watcher for Jest's watch mode, and fsevents on macOS).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run check -w packages/tokens

  test:
    name: Unit and e2e tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # The same local services as in development (compose.yaml), with fresh random
      # secrets for this run only, so integration tests hit real Postgres, Redis, S3 and SMTP.
      - name: Start local services
        run: |
          node scripts/init-dev-env.mjs
          docker compose up -d --wait
      - run: npm ci --ignore-scripts
      - run: npm run build:contracts
      - run: npm run db:migrate -w api
      - run: npm test
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspaces --if-present

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads the lockfile only. Fails on high or critical advisories; the known
      # moderate/low ones inside Jest are documented in CLAUDE.project.md.
      - run: npm audit --audit-level=high
